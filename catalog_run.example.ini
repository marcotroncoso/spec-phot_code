# Config for run_catalog_photometry.py: photometry of any source catalog on any
# HST / JWST images (no IsolatedSourceFinder, no PHANGS DR5 catalog, no MUSE).
# Copy this file, edit it, and run
#     python run_catalog_photometry.py --config my_run.ini
# Relative paths are relative to this file.

[catalog]
# Source table: FITS, ECSV, CSV, ... (anything astropy Table.read reads)
file = my_clusters.ecsv
# Optional astropy format if the extension is ambiguous (e.g. ascii.csv)
format =
# Field / galaxy name: output folder <output_dir>/<name>/, file prefix, and the
# row of the PSF table when psf_source = table (default: theoretical PSFs, no table)
name = NGC3351
# RA / Dec columns: degrees, or sexagesimal strings
ra_col = RA
dec_col = DEC
# ID column (blank: row number, starting at 1)
id_col = ID
# Cluster class column: YCL / MAP -> EFF gamma=3 profile, OGCC -> King c=1.5,
# anything else (or blank) -> EFF gamma=3
class_col =
# Distance: one value for every source [Mpc], or a per-source column.
# Needed for R_eff in pc and the 20 pc R_eff cap.
distance_mpc = 9.96
dist_col =
# Milky Way foreground E(B-V); blank = SFD (dustmaps) at the catalog's centre
ebv =

[images]
# One line per band:  BAND = path[, FITS extension]
# Supported bands: F275W F336W F438W F555W F814W (HST: Jy/pixel, header INSTRUME
# WFC3 or ACS), F200W F300M F335M F360M F770W F1000W F1130W F2100W (JWST:
# MJy/sr with PIXAR_SR, or DN/s with PHOTMJSR and PIXAR_SR).
# Default extension: HST the primary HDU, JWST 'SCI' (else extension 1).
F555W = /path/to/hlsp_phangs-hst_hst_wfc3-uvis_ngc3351_f555w_v1_exp-drc-sci_anchor.fits
F814W = /path/to/hlsp_phangs-hst_hst_wfc3-uvis_ngc3351_f814w_v1_exp-drc-sci_anchor.fits
F200W = /path/to/hlsp_2107_jwst_nircam_ngc3351_f200w_v4p1_anchor-atf200w.fits, SCI
# Or find every band of a PHANGS galaxy (named as [catalog] name) under the
# PHANGS roots, as run_full_pipeline.py does; explicit lines above win.
hst_root =
jwst_root =

[run]
output_dir = output_custom
# PSF FWHM table: only used with psf_source = table (read, appended when measured)
psf_filepath = data/psf_table.csv
# Worker processes for the per-source photometry
n_workers = 4
# Instrument-PSF photometry (instG, instP) on top of native
instrument_fit = True
instrument_slit_width_px = 1
# PSF of the instrument fits (instG, instP, 2D): the theoretical PSF (STScI
# effective PSF for HST, stpsf for JWST) plus an optional extra Gaussian blur:
#   none    : no blur, the theoretical PSF (default)
#   galaxy  : blur tuned to this galaxy's measured FWHM in psf_table.csv (those
#             FWHMs come from the brightest compact sources, often clusters, so
#             they broaden the PSF and shrink R_eff)
#   default : the sample-median blur of instrument_psf.py
#   <number>: that blur FWHM in arcsec, every band
psf_extra_blur = none
# Where every PSF FWHM / shape comes from (convolution to MUSE, the native
# method, the ISF):
#   theoretical : the theoretical PSFs (STScI effective PSFs for HST, stpsf for
#                 JWST), and for MUSE the FWHM in the token name
#                 (NGC1365-1.15asec -> 1.15"). Nothing is measured on the
#                 images and psf_table.csv is not used. (default)
#   table       : psf_table.csv, measuring missing bands on the images (old)
psf_source = theoretical
# Keep only sources that fall on a valid pixel of every image
require_all_bands = True
# Ignore the cached _native / _instrument tables and remeasure
force_recompute = False
# 2D model fits (any of: fixed free Gfixed Gfree); blank = none
modes_2d =
# Per-source plots: none, slits (instP slit profiles), 2d (2D models, needs
# modes_2d) or all. One PNG per source, slow for big catalogs.
plots = none
# Write a CIGALE input table
cigale_export = False
cigale_h0 = 70.0

[profile]
# Intrinsic cluster profile of the instP and 2D fits (convolved with the PSF).
# YCL, MAP and unclassified clusters: EFF (Elson+87) = Moffat,
#     Sigma(r) ∝ (1 + r²/a²)^(-gamma/2)      (Moffat beta = gamma/2)
# The core radius a is always fitted (through R_eff, the half-light radius
# within the 10 R_eff truncation). The power index gamma is fixed at eff_gamma,
# or fitted per source and band within [eff_gamma_min, eff_gamma_max] when
# eff_gamma_free = True (about 5x slower). EFF needs gamma >= 1.8 here.
eff_gamma = 3.0
eff_gamma_free = False
eff_gamma_min = 2.0
eff_gamma_max = 6.0
# OGCC: King with concentration king_c = log10(r_t / r_c), or 'eff' to use the
# EFF settings above for them too
ogcc_profile = king
king_c = 1.5
# Changing any of these makes the next run recompute the instrument photometry
# (the cache header records the profile).

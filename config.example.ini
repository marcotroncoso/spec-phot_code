# Configuration for run_full_pipeline.py — batch IsolatedSourceFinder +
# Photometry (v1 + v2) run across the PHANGS MUSE/HST/JWST sample, plus
# the final CIGALE export.

[paths]
# HST anchor images root; per-galaxy images live in <hst_root>/<GALAXY>/
hst_root = /path/to/PHANGS/HST/anchor/
# JWST anchor images root; per-galaxy images live in <jwst_root>/<galaxy_lower>/
jwst_root = /path/to/PHANGS/JWST/v4p1/2107/release/
# MUSE DAP root; per-galaxy maps live in <muse_dap_root>/<TOKEN>/<TOKEN>_DR2.2v2/<TOKEN>_MAPS.fits
muse_dap_root = /path/to/PHANGS/MUSE/DAP/DR2.2v2/copt/data
# PHANGS-HST cluster catalog root (DR5-style human/machine primary catalogs)
cat_path = /path/to/PHANGS/HST/Products/cluster_catalogs/DR5
# Shared PSF CSV table (read/written by IsolatedSourceFinder + Photometry).
# Relative paths in [paths] are relative to this config file.
psf_filepath = data/psf_table.csv
# Root output directory — per-galaxy results go to <output_dir>/<GALAXY>/
output_dir = output
# Output root of catalog mode (source_catalog = catalog); blank = <output_dir>_catalog
catalog_output_dir =
# Output root of the validation/ scripts (mocks, method comparisons, ...)
validation_output_dir = validation/output

[galaxies]
# 'auto' = every galaxy under muse_dap_root (as a '<GAL>-<X.XX>asec'
# directory) that also has an HST and a JWST directory. Otherwise a
# comma-separated list of MUSE tokens, e.g.:
#   list = NGC1365-1.15asec, NGC4254-0.89asec
list = NGC4254-0.89asec
# IsolatedSourceFinder's `sample` argument (selects the MAPS.fits subpath
# convention — 'PM' for this PHANGS-MUSE DR2.2v2 layout).
sample = PM

[run]
# Run IsolatedSourceFinder.run_full_pipeline() when a galaxy's ISF
# products (<GALAXY>_matched.fits etc.) are missing under output_dir.
# If False, galaxies missing those products are skipped with an error
# instead of being (re)computed.
run_isf = True
# Optional steps of the same run, per galaxy, after the native + instP
# photometry (all their settings are in the sections below):
#   run_2d      : pixel-by-pixel 2D model fits ([2d]); their fluxes are merged
#                 into <GALAXY>_photometry_v2.fits
#   run_spectra : MUSE cluster spectra, M1 annulus + M2 PSF fit ([muse_spectra]);
#                 ISF mode only (ignored with source_catalog = catalog)
#   run_sed     : SED plots of every cluster (HST + JWST photometry with the MUSE
#                 spectra), after the galaxy's injection test that gives their
#                 systematic errors ([sed]); needs the spectra
# A failed optional step is reported but does not fail the galaxy.
run_2d = False
run_spectra = False
run_sed = False
# The pipeline remembers what it has done: a step is skipped when its
# outputs exist and are up to date, and recomputed when what it depends on
# changed:
#   ISF          <GAL>_matched.fits exists and was made with the same
#                psf_source and [galaxies] sample
#   photometry   caches (v1, native, instP) newer than the ISF products and
#                made with the same PSF / profile / slit settings
#   plots        one PNG per source, newer than the results they show
#   2D, spectra  see [2d] / [muse_spectra] overwrite
# redo: steps to recompute anyway, comma separated, any of
#   isf, photometry, 2d, spectra, injection, sed, plots   (or all). Blank = only what is
#   needed. Recomputing the ISF also recomputes everything after it.
redo =
# Old switch: True is the same as redo = all
force_recompute = False
# Save native_diagnostics/ + native_size_calibration/ PNGs for every
# source (run_native_photometry's plot_diagnostics). Slow for large
# samples — set False to skip.
plot_diagnostics = True
# Also run the instrument-PSF photometry (Photometry.run_instrument_photometry):
# PSF (x) Gaussian and PSF (x) cluster profile (YCL/MAP -> EFF gamma=3,
# OGCC -> King c=1.5) fits, columns flux_instG_<band> / flux_instP_<band>,
# cached in <GALAXY>_photometry_instrument.fits.
instrument_fit = True
# Slit width (px) of the instrument fit's averaged slit profile.
instrument_slit_width_px = 1
# PSF of the instrument fits (instG, instP, 2D): the theoretical PSF (STScI
# effective PSF for HST, stpsf for JWST) plus an optional extra Gaussian blur:
#   none    : no blur, the theoretical PSF (default)
#   galaxy  : blur tuned to this galaxy's measured FWHM in psf_table.csv (those
#             FWHMs come from the brightest compact sources, often clusters, so
#             they broaden the PSF and shrink R_eff)
#   default : the sample-median blur of instrument_psf.py
#   <number>: that blur FWHM in arcsec, every band
psf_extra_blur = none
# Where every PSF FWHM / shape comes from (convolution to MUSE, the native
# method, the ISF):
#   theoretical : the theoretical PSFs (STScI effective PSFs for HST, stpsf for
#                 JWST), and for MUSE the FWHM in the token name
#                 (NGC1365-1.15asec -> 1.15"). Nothing is measured on the
#                 images and psf_table.csv is not used. (default)
#   table       : psf_table.csv, measuring missing bands on the images (old)
psf_source = theoretical
# Source list: 'isf' = the IsolatedSourceFinder selection (isolated clusters
# matched to MUSE; the normal run) or 'catalog' = every cluster of the
# PHANGS-HST DR5 catalog that falls on all HST and JWST images (native +
# instrument photometry only: no ISF, no convolved photometry, no MUSE
# spectra, no per-source diagnostic PNGs). Same as run_full_pipeline.py
# --catalog-mode. Results go to catalog_output_dir.
source_catalog = isf
# Catalog mode: 'machine' (PHANGS_CC_CLASS_ML; what the ISF starts from) or 'human'
catalog_selection = machine
# Catalog mode: DR5 primary files to use, '1+2' or '1+2, 3'
catalog_classes = 1+2
# Catalog mode: worker processes for the per-source photometry of ONE galaxy
# (hundreds of sources; the normal run uses 1 per galaxy)
catalog_n_workers = 8
# Catalog mode: drop clusters whose colour-colour class is 'outside' (not
# YCL/MAP/OGCC) — the ISF selection drops them; False keeps the full catalog
catalog_drop_outside = False
# Number of galaxies to process concurrently (one process per galaxy,
# fully sequential internally — see run_full_pipeline.py's module
# docstring for why). Leave blank to be prompted interactively when the
# script runs.
#
# Memory: each galaxy's own process is torn down (memory returned to the
# OS) as soon as that galaxy finishes, so peak total memory is roughly
# n_workers x the single largest galaxy's footprint — not the sum across
# every galaxy ever processed. Run a batch once, check the "Peak memory
# per galaxy" line it prints at the end (or peak_rss_gb in any galaxy's
# pipeline.log), and size n_workers from that against the machine's
# actually-available memory (see `free -h`) rather than guessing.
n_workers =

[profile]
# Intrinsic cluster profile of the instP and 2D fits (convolved with the PSF).
# YCL, MAP and unclassified clusters: EFF (Elson+87) = Moffat,
#     Sigma(r) ∝ (1 + r²/a²)^(-gamma/2)      (Moffat beta = gamma/2)
# The core radius a is always fitted (through R_eff, the half-light radius
# within the 10 R_eff truncation). The power index gamma is fixed at eff_gamma,
# or fitted per source and band within [eff_gamma_min, eff_gamma_max] when
# eff_gamma_free = True (about 5x slower). EFF needs gamma >= 1.8 here.
eff_gamma = 3.0
eff_gamma_free = False
eff_gamma_min = 2.0
eff_gamma_max = 6.0
# OGCC: King with concentration king_c = log10(r_t / r_c), or 'eff' to use the
# EFF settings above for them too
ogcc_profile = king
king_c = 1.5
# Changing any of these makes the next run recompute the instrument photometry
# (the cache header records the profile).

[cigale]
# After each galaxy finishes, write one CIGALE-format ascii table (one
# row per source) as <output_dir>/<GALAXY>/<GALAXY>_cigale_input.<ext>
# — no combined master table across galaxies.
export = True
# File extension for the per-galaxy table ('txt' or 'dat').
ext = txt
# km/s/Mpc, used to derive redshift from each cluster's PHANGS_DMPC via
# the Hubble-law approximation (z = H0*D/c).
h0 = 70.0

[2d]
# 2D model fits (run_2d = True in [run]; also run_2d_photometry.py): flux x
# [profile (x) PSF] + constant fitted to every pixel within the fit radius.
# Modes, any of: fixed free Gfixed Gfree  (fixed/free = centre at the instP
# centre / fitted; G = Gaussian source profile instead of the [profile] one)
modes = fixed free
# Worker processes per galaxy (the total is about galaxies x this)
n_workers = 4
# One data / model / residual PNG per source and mode (photometry_2d_plots/)
plots = False
# Also fit bands where the native method found no emission of its own
all_bands = False
# Refit even when <GALAXY>_photometry_2d.fits already has the modes and is
# newer than the instrument photometry
overwrite = False

[sed]
# SED plots (run_sed = True in [run]; also validation/muse_sed_example.py),
# in <GALAXY>/muse_spectra/sed/<row>_<class>_sed.png
# Run the galaxy's injection test (fake clusters added to the cube and
# recovered with M1/M2; muse_injection.py) when it is missing or older than the
# spectra; its scatter is the systematic error of the MUSE points. False: no
# test, statistical errors only (the plots say so).
injection = True
# Injection positions per Halpha environment (low / mid / high); 4 cases each
n_per_env = 10
# Worker processes of the injection test, per galaxy
n_workers = 4
# Redraw the SED plots even when they are newer than the spectra, the
# photometry and the injection results
overwrite = False

[qa]
# Pooled QA plots (plot_qa_diagnostics.py) of every galaxy in the output
# folder, made once at the end of a batch run. Single-galaxy runs (--galaxy)
# skip them; make them later with: python run_full_pipeline.py --qa-only
run_qa = True
# Output folder; blank = <output_dir>/qa_plots
qa_dir =
# all, or a comma list of: isolation, phot_native_convolved, phot_native_catalog,
# phot_convolved_catalog, ccd_optical, ccd_ir_nircam, ccd_ir_miri, detection,
# recenter, phot_instp_catalog, phot_instp_native, phot_instp_catalog_galaxy,
# ccd_optical_instp, reff_instp, spectra_photometry
plots = all

[muse_spectra]
# Settings of the MUSE cluster spectra: used by run_full_pipeline.py when
# run_spectra = True in [run], and by run_muse_spectra.py (galaxy given with
# --galaxy; its command-line flags override these values).
# ISF region used as the extraction aperture: MUSE or HST
aperture = MUSE
# Observed wavelength range used [A]; above ~7000 A sky residuals and telluric
# bands make the cluster spectra unreliable
wave_min = 4850
wave_max = 7000
# M1 (annulus): gap between the aperture and the annulus, and annulus width,
# in units of the MUSE PSF FWHM
gap_fwhm = 1.0
width_fwhm = 2.0
# M1: spline annulus continuum instead of interpolating over the line windows
smooth = False
# M2 (PSF fit): half-size of the fitted stamp [MUSE px] and ridge strength
# on the extended-background patches
fit_half = 20
ridge = 0.01
# Parallel worker processes (run under nice; 1 BLAS thread each)
n_workers = 4
# Per-source spectra figures plus the PSF / summary / photometry-comparison figures
plots = True
# Recompute the spectra even when <GALAXY>_muse_spectra.fits is newer than the
# ISF products (otherwise up-to-date spectra are skipped)
overwrite = False
